<!doctype html>
<html lang="en" class="dark h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rory Skagen Studio | Art Works</title>
    <meta name="description" content="Official fine art gallery and studio portfolio for artist Rory Skagen. Showcasing and selling original paintings, murals, pop surrealism, and limited fine art works." />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#2B2B2E" />
    <meta property="og:title" content="Rory Skagen Studio | Art Works" />
    <meta property="og:description" content="Official fine art gallery and studio portfolio for artist Rory Skagen." />
    <meta property="og:image" content="/android-chrome-512x512.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Rory Skagen Studio | Art Works" />
    <meta name="twitter:description" content="Official fine art gallery and studio portfolio for artist Rory Skagen." />
    <meta name="twitter:image" content="/android-chrome-512x512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      /*
       * No-flash theme boot (runs before the bundle, blocking on palette only).
       * 1. Apply the cached palette from localStorage immediately (same key
       *    the app reads/writes) — covers repeat visits with zero requests.
       * 2. Fetch the published palette from /api/settings and update the
       *    cache when it differs.
       * 3. Reveal the app only once the palette is applied (or after a
       *    bounded timeout so a slow API can never wedge the page). While
       *    gated, html carries `palette-booting` and CSS keeps the page in
       *    the pre-palette shell color instead of the default theme.
       */
      (function () {
        try {
          // Mode: mirror ThemeContext's localStorage key.
          var mode = 'dark';
          try { mode = localStorage.getItem('rory_studio_theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
          var root = document.documentElement;
          root.classList.remove('dark', 'light');
          root.classList.add(mode);
          root.style.colorScheme = mode;

          var STYLE_ID = 'palette-boot-vars';
          var CACHE_KEY = 'rory_studio_palette';

          function applyPalette(p) {
            if (!p || !p.light || !p.dark) return false;
            var block = function (c) {
              if (!c) return '';
              return '--background:' + c.background + ';--foreground:' + c.foreground +
                ';--card:' + c.card + ';--surface:' + c.surface + ';--surface-deep:' + c.surfaceDeep +
                ';--border:' + c.border + ';--line-strong:' + c.borderStrong + ';--ring:' + c.accent +
                ';--popover:' + c.card + ';--secondary:' + c.surface + ';--muted:' + c.surface +
                ';--primary:' + c.borderStrong + ';--accent:' + c.surface + ';';
            };
            var el = document.getElementById(STYLE_ID) || (function () {
              var s = document.createElement('style');
              s.id = STYLE_ID;
              document.head.appendChild(s);
              return s;
            })();
            el.textContent = ':root{' + block(p.light) + '}.dark{' + block(p.dark) + '}';
            return true;
          }

          var cached = null;
          try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch (e) {}
          var applied = cached ? applyPalette(cached) : false;

          var reveal = function () {
            root.classList.remove('palette-booting');
          };

          if (applied) {
            // Cache applied — reveal on next frame so the style is committed first.
            requestAnimationFrame(function () { requestAnimationFrame(reveal); });
          } else {
            root.classList.add('palette-booting');
          }

          // Always revalidate against the server (custom styles may have changed).
          fetch('/api/settings', { credentials: 'include' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (data) {
              var stored = data && data.settings && data.settings.theme_palette;
              if (stored && stored.light && stored.dark) {
                var merged = stored;
                try {
                  localStorage.setItem(CACHE_KEY, JSON.stringify(merged));
                } catch (e) {}
                if (applyPalette(merged)) {
                  reveal();
                  return;
                }
              }
              if (!applied) reveal();
            })
            .catch(function () { if (!applied) reveal(); });

          // Hard bound: never keep the page hidden longer than this.
          setTimeout(reveal, 1500);
        } catch (e) {
          document.documentElement.classList.remove('palette-booting');
        }
      })();
    </script>
    <style>
      /* Pre-palette gate: hold the shell in the default dark background so
         first paint never flashes the light default before custom colors land. */
      html.palette-booting, html.palette-booting body {
        background-color: #17171b !important;
      }
      html.palette-booting #root { visibility: hidden; }
    </style>
  </body>
</html>
